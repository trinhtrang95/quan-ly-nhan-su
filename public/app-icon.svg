<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F232E" />
      <stop offset="55%" stop-color="#132D3B" />
      <stop offset="100%" stop-color="#163546" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="96" y1="80" x2="416" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="300" y1="280" x2="440" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0F232E" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer Rounded Square Background -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#glowGrad)" />
  <!-- Subtle Inner Teal Border -->
  <rect x="18" y="18" width="476" height="476" rx="104" stroke="#14B8A6" stroke-opacity="0.3" stroke-width="6" />

  <!-- Top Decorative Enterprise Arc / Clock Ring -->
  <path d="M124 176C148 118 205 80 272 80C360 80 432 152 432 240" stroke="url(#tealGrad)" stroke-width="14" stroke-linecap="round" stroke-opacity="0.45" />

  <!-- Secondary User Silhouette (Left/Back - Teal Accent) -->
  <circle cx="176" cy="172" r="42" fill="#2DD4BF" fill-opacity="0.88" />
  <path d="M98 302C98 258 132 228 176 228C204 228 228 240 242 260" stroke="#2DD4BF" stroke-width="26" stroke-linecap="round" fill="none" />

  <!-- Primary User Silhouette (Center/Front - Crisp White) -->
  <circle cx="256" cy="154" r="54" fill="#FFFFFF" />
  <path d="M148 334C148 274 196 232 256 232C316 232 364 274 364 334" fill="#FFFFFF" />

  <!-- Bold Stylized "HR" Monogram Pill at Bottom-Left / Center Base for 16x16 & 32x32 Taskbar Legibility -->
  <rect x="92" y="296" width="216" height="124" rx="34" fill="#0B1B24" stroke="url(#tealGrad)" stroke-width="8" />
  <!-- Letter H -->
  <path d="M132 326V390M176 326V390M132 358H176" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Letter R -->
  <path d="M212 390V326H244C257 326 266 334 266 346C266 358 257 366 244 366H212M240 366L266 390" stroke="#2DD4BF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Attendance Checkmark / Clock Badge (Bottom-Right) -->
  <circle cx="372" cy="356" r="72" fill="#0F232E" />
  <circle cx="372" cy="356" r="62" fill="url(#badgeGrad)" stroke="#FFFFFF" stroke-width="8" />
  <path d="M344 356L364 376L404 336" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
</svg>
